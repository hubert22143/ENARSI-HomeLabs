!
hostname R1
no ip domain-lookup
!
interface Loopback0
 no shutdown
 ip address 1.1.1.1 255.255.255.0
!
interface GigabitEthernet0/0
 no shutdown
 ip address 192.168.12.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
router rip
 version 2
 network 1.0.0.0
 network 192.168.12.0
 no auto-summary
!
end

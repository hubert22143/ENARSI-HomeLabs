!
hostname R4
no ip domain-lookup
!
interface GigabitEthernet0/0
 no shutdown
 ip address 192.168.34.2 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no shutdown
 ip address 192.168.24.2 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
router eigrp 1
 network 192.168.24.0 0.0.0.255
 network 192.168.34.0 0.0.0.255
 no auto-summary
!
end

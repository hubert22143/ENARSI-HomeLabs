!
hostname R3
no ip domain-lookup
!
interface GigabitEthernet0/0
 no shutdown
 ip address 192.168.23.2 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no shutdown
 ip address 192.168.34.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 shutdown
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
router eigrp 1
 network 192.168.34.0 0.0.0.255
 redistribute ospf 1 metric 1500 100 255 1 1500 route-map OSPF_TO_EIGRP
 no auto-summary
!
router ospf 1
 redistribute eigrp 1 subnets route-map EIGRP_TO_OSPF
 network 192.168.23.0 0.0.0.255 area 0
!
route-map EIGRP_TO_OSPF deny 10
 match tag 120
!
route-map EIGRP_TO_OSPF permit 20
 set tag 90
!
route-map OSPF_TO_EIGRP deny 10
 match tag 90
!
route-map OSPF_TO_EIGRP permit 20
 set tag 110
!
end
